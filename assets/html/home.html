<!DOCTYPE html>
<html lang="en" class="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Popflix - Home</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <a href="home.html" class="logo">
        <span class="logo-pop">Pop</span><span class="logo-flix">flix</span>
    </a>
    <div class="header-icons">
        <button class="icon-button" id="search-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
        <div class="profile-container">
            <span id="header-username"></span>
            <button class="icon-button profile-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </button>
        </div>
    </div>
</header>

<main>
    <div class="slider-container">
        <ul class="slider">
            <li class="item skeleton-slider-item"></li>
        </ul>
    </div>

    <div id="home-sections">
        <div id="user-favorites-container" class="section-container" style="display: none;"></div>
        <div class="section-container">
            <h2>Today's Feature</h2>
            <div class="carousel-wrapper">
                <div class="movie-carousel" id="todays-feature"></div>
            </div>
        </div>
        <div id="user-completed-container" class="section-container" style="display: none;"></div>
        <div id="user-watchlist-container" class="section-container" style="display: none;"></div>
        <div class="section-container">
            <h2>Latest Releases</h2>
            <div class="carousel-wrapper">
                <div class="movie-carousel" id="latest-releases"></div>
            </div>
        </div>
        <div class="section-container">
            <h2>Popular</h2>
            <div class="carousel-wrapper">
                <div class="movie-carousel" id="popular-movies"></div>
            </div>
        </div>
        <div class="section-container">
            <h2>For Kids</h2>
            <div class="carousel-wrapper">
                <div class="movie-carousel" id="kids-movies"></div>
            </div>
        </div>
        <div class="section-container">
            <h2>Anime</h2>
            <div class="carousel-wrapper">
                <div class="movie-carousel" id="anime-movies"></div>
            </div>
        </div>
        <div class="section-container">
            <h2>Popular Web Series</h2>
            <div class="carousel-wrapper">
                <div class="movie-carousel" id="web-series"></div>
            </div>
        </div>
    </div>
</main>

<footer>
    <p>&copy; 2024 Popflix. All Rights Reserved.</p>
</footer>

<!-- Modals -->
<div id="search-overlay" class="modal-overlay hidden"></div>
<div id="profile-modal" class="modal-overlay hidden">
    <div class="profile-drawer"></div>
</div>
<div id="generic-modal" class="modal-overlay hidden"></div>

<!-- Scripts -->
<script type="module" src="../js/firebase-config.js"></script>
<script type="module" src="../js/script.js"></script>
<script type="module" src="../js/profile.js"></script>
<script type="module" src="../js/ui.js"></script>

</body>
</html>
